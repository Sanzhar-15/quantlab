# Quantbook Engine — Cargo workspace
# Phase 0 viability spike. See ../.plans/_QUANTBOOK-v1-SPECIFICATION.md Part V.
#
# IMPORTANT: per Cargo's rules (https://doc.rust-lang.org/cargo/reference/workspaces.html),
# [workspace.dependencies] entries CANNOT carry `optional = true`. Optionality lives on the
# consuming crate's Cargo.toml. There is no `[workspace.features]` table — features belong on
# member crates. This file is the result of codex r9 audit corrections.

[workspace]
resolver = "2"
members = ["crates/*"]
# Phase 0 active set (other crates are stubs reserving the workspace tree):
default-members = [
    "crates/ql-types",
    "crates/ql-storage",
    "crates/ql-formula-syntax",
    "crates/ql-formula-semantics",
    "crates/ql-functions",
    "crates/ql-calcgraph",
    "crates/ql-exec",
    # Phase 6.4-3c (2026-05-29): ql-udf joins the active set now that ql-exec
    # depends on it for Python-UDF dispatch (was member-only through 6.4-3a/b).
    "crates/ql-udf",
    "crates/ql-bench",
    "crates/ql-profile",
    "crates/ql-oplog",
    "crates/ql-terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor 1.85: required for edition2024 (clap_lex 1.1.0 transitively via criterion). Day 2
# bump from 1.83. Build is pinned to 1.95.0 in rust-toolchain.toml.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Apache Arrow — exact pins for Phase 0. All 7 crates kept in lock-step at the same patch
# (58.3.0 is the latest 58.x patch as of 2026-05-11; arrow-array 58.1.0's `^58` transitive
# would otherwise drift arrow-buffer to 58.3 and break the pin guard).
arrow = "=58.3.0"
arrow-array = "=58.3.0"
arrow-buffer = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-select = "=58.3.0"
arrow-arith = "=58.3.0"
arrow-cast = "=58.3.0"

# Concurrency
rayon = "=1.12.0"
tokio = { version = "=1.50.0", default-features = false, features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "signal"] }

# Phase 5.5 V2 V3 step 4 (2026-05-21) — WebSocket transport in ql-collab-ws.
# tokio-tungstenite is the de-facto async websocket client for tokio.
# futures-util provides SplitSink / SplitStream + StreamExt::next /
# SinkExt::send. MVP scope: no TLS feature flags (plain ws:// only);
# V2 V4 adds rustls. tokio-tungstenite 0.29.0 depends on tokio ^1.0
# (compat with our =1.50.0 pin) and futures-util ^0.3.28.
tokio-tungstenite = "=0.29.0"
futures-util = { version = "=0.3.32", default-features = false, features = ["std", "sink"] }

# Phase 6.2 (2026-06-01) — ql-service HTTP+SSE engine-as-service transport.
# User decision: HTTP+SSE on hyper (battle-tested HTTP/1.1 core, far lighter than
# axum — no tower/macro layers — respecting this workspace's minimal-dep discipline).
# hyper 1.x split the tokio runtime glue into hyper-util (`rt::TokioIo` adapts a
# tokio TcpStream to hyper's rt::Read/Write); http-body-util provides Full/collect
# body combinators; `http` carries StatusCode/Method/header; bytes backs the body.
# Exact-pinned to the latest stable as of 2026-06-01. Used ONLY by ql-service
# (member-only, like ql-collab-ws — NOT in default-members, so a bare `cargo build`
# is unperturbed; `cargo build --workspace` still covers it).
hyper = { version = "=1.10.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.3"
http = "=1.4.1"
bytes = "=1.11.1"

# 6.2-3b (2026-06-01) -- unguessable ql-service session ids: 16 CSPRNG bytes
# (getrandom::fill) -> 32-char hex, replacing the sequential s<n>. Already in the
# lock (transitive); pinned exact + promoted to a direct edge here. ql-service only.
getrandom = "=0.3.4"

# Phase 5.5 V2 V4 V1 step 3 (2026-05-21) — Tier J3 + K5. Compile-time
# `assert_impl_all!` proofs for `WebSocketTransport: Sync` and
# `WebSocketError: Send + Sync`. (The V2 V3 step 4 docstring claimed
# !Sync; step 3 implementation revealed the type is actually Sync —
# all fields happen to be Sync; the single-consumer mpsc constraint
# is enforced by `try_recv(&mut self)`, not by !Sync.)
# `static_assertions` is a tiny no-runtime-cost crate exposing the
# `assert_impl_all!` macro. Used only by ql-collab-ws.
static_assertions = "=1.1.0"

# Phase 5.7 V1 (2026-05-22) — VS Code extension binding via napi-rs.
# `ql-bindings-node` builds a `.node` cdylib loaded by the quantlab
# VS Code fork's extension host (Node.js). napi-rs 3.x is the current
# major; napi-derive provides the `#[napi]` proc-macro; napi-build is
# the build.rs helper that locates Node headers + emits cargo:rustc-cfg
# directives. cdylib output naming differs per platform (.dylib / .so /
# .dll); the @napi-rs/cli npm tool typically renames to `.node`, but
# for V1 we load the raw cdylib via an explicit path in TS code.
napi = { version = "=3.9.0", default-features = false, features = ["napi8", "async"] }
napi-derive = "=3.5.6"
napi-build = "=2.3.2"

# Bench
criterion = { version = "=0.8.2", default-features = false, features = ["html_reports"] }
# Property-based testing for invariant checks (ql-storage, ql-calcgraph, ql-exec dev-deps)
proptest = "=1.8.0"

# SIMD (runtime dispatch per Phase 0 Decision F).
# pulp's default features include `x86-v3` (= AVX2 baseline at compile time), which would
# defeat A3 by baking AVX2 into distributable binaries. We disable defaults and opt back in
# to `std` only; runtime dispatch comes from pulp's per-function `Arch::detect()` and
# `multiversion`. Do NOT add `x86-v3`/`x86-v4` to features here.
pulp = { version = "=0.22.2", default-features = false, features = ["std"] }
multiversion = "=0.8.0"
bytemuck = "=1.25.0"

# Python interop (Phase 5; reserved in workspace pins for consistency)
pyo3 = { version = "=0.28.3", default-features = false, features = ["extension-module", "abi3-py310"] }

# WASM (later phases). Pinned to 0.2.121 (latest 2026-05-11; the older 0.2.118 drifted via
# transitive resolution after toolchain bump 1.83→1.95 — see scripts/check-cargo-lock-pins.sh).
wasm-bindgen = "=0.2.121"

# Storage / formats (later phases)
polars = { version = "=0.53.0", default-features = false, features = ["lazy", "fmt", "parquet"] }
datafusion = { version = "=53.1.0", default-features = false }
duckdb = { version = "=1.10502.0", default-features = false, features = ["bundled", "appender-arrow"] }
calamine = "=0.34.0"

# Reactive (salsa = experiments only per Decision A) / collab
salsa = "=0.26.2"
loro = "=1.12.0"

# Utility
thiserror = "=2.0.18"
tracing = "=0.1.44"
dashmap = "=6.1.0"
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
mimalloc = { version = "=0.1.48", default-features = false }
num_cpus = "=1.17.0"
# Phase 2A.10 audit H3/M14: SipHash24 with a fixed seed for stable formula
# fingerprints. `siphasher` pins the algorithm contract (unlike stdlib
# `DefaultHasher` whose internal algorithm is not specified). 800 MB/s
# throughput is plenty for fingerprint use; we don't need BLAKE3's
# cryptographic strength.
siphasher = "=1.0.1"

# Serialization (graph-profile.json export — OG-06; `.qbook/workbook.toml` envelope per
# the Phase 1 workbook format).
serde = { version = "=1.0.228", features = ["derive"] }
# `raw_value` (6.2-4): ql-service emits cell numbers as ECMAScript `Number` tokens
# (unquoted `6`/`0`/`1e+21`) via `serde_json::value::RawValue`, matching the frozen
# napi wire. Additive feature; no new crate edge in the lock.
serde_json = { version = "=1.0.149", features = ["raw_value"] }
toml = "=0.9.7"

# `ryu-js` (6.2-4): ECMAScript-compliant f64->string (Boa's JS-semantics Ryu). Used by
# ql-service to render cell numbers byte-identically to V8 / the frozen napi wire --
# including the shortest-decimal tie-break that Rust's own formatter resolves differently
# (~0.025% of f64; caught by the 6.2-4 megaudit). No required runtime deps of its own.
ryu-js = "=1.0.2"

# Statistical distributions (Wave 3 distributions batch: NORM.* / T.* /
# CHISQ.* / F.* / BINOM.* / POISSON.* / GAMMA.* / BETA.*). IronCalc uses
# the same crate at the same pin — matching their version for canon
# behavioral compatibility. `default-features = false` keeps the crate
# minimal (no rand integration).
statrs = { version = "=0.18.0", default-features = false }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
