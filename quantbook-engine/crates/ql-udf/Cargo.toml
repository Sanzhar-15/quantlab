[package]
name = "ql-udf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# **Phase 6.4-3a (2026-05-28):** out-of-process UDF worker transport + codec.
# LEAF crate (dependency-inversion, mirroring `ql-io-csv`/`ql-io-xlsx`): owns the
# wire protocol + the Arrow<->engine-Value codec + the `UdfWorker` abstraction,
# depending ONLY on `ql-types` (`Value`/`ArrayValue`/`ErrorValue`) + `arrow` (the
# IPC wire format) + `thiserror`. It must NEVER depend on `ql-functions`/`ql-exec`
# — the eval layer (6.4-3c) adapts `FunctionArg`/`FunctionReturn` <-> `ArrayValue`
# at the dispatch site and injects a worker.
ql-types = { path = "../ql-types" }

# Arrow is already a pinned workspace dependency (used by ql-bench). **6.4-3a
# audit-fix (M4):** declare the `ipc` feature EXPLICITLY (additively) rather than
# silently relying on the umbrella crate's defaults — `ipc` is the one feature this
# crate hard-depends on (`StreamReader`/`StreamWriter` for the on-wire RecordBatch
# stream); `arrow-array`/`arrow-schema` (RecordBatch, the typed arrays, DataType/
# Field/Schema) are non-optional and always present. Declaring `ipc` here keeps the
# requirement visible AND robust to a future workspace-level `default-features =
# false` (this crate would still pull `ipc`). NB: `default-features = false` on an
# inherited workspace dep is ignored-with-warning unless the workspace sets it too,
# so it is deliberately omitted here (the additive `features` is what matters).
arrow = { workspace = true, features = ["ipc"] }

thiserror = { workspace = true }

[dev-dependencies]
# Integration tests (`tests/process_smoke.rs`) are a separate crate and need
# `ql-types` directly to build engine `ArrayValue`/`Value` inputs.
ql-types = { path = "../ql-types" }
