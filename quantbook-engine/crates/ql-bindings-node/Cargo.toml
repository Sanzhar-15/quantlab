[package]
name = "ql-bindings-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# **Phase 5.7 V1 (2026-05-22) — VS Code extension binding.**
# Previously a Phase 6+ reserved placeholder (see `ql-bindings-c` for
# the parallel C-FFI placeholder, still reserved). Filled at Phase 5.7
# V1 to bind `CollabSession` for the quantlab VS Code fork's extension
# host (Node.js).
#
# cdylib output for Node.js to load. The build artifact lives at
# `target/{debug,release}/libql_bindings_node.{dylib,so,dll}` per Cargo
# convention. The IDE extension's loader.ts is responsible for finding
# this path (env var `QUANTBOOK_ENGINE_PATH` defaulting to a workspace-
# relative dev location). V2+ will publish via `@napi-rs/cli` or a
# custom artifact pipeline.
#
# Why napi-rs (not wasm or subprocess): see `.plans/_active.md` table.
# tl;dr: only option that preserves the engine's tokio runtime AND
# gives direct memory access for hot paths.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# napi8 feature + default-features = false set at workspace level
# (see workspace Cargo.toml). napi8 targets Node.js 12+ — VS Code's
# electron / Node.js bundle is well past that floor.
napi = { workspace = true }
napi-derive = { workspace = true }

# **V1 scope (per `.plans/_active.md`):** `CollabSession` only.
# **V2.1 + V2.2 (2026-05-22):** added sync Transport surface
# (LoopbackPair + attach/detach/flush*/poll* + AutoFlushPolicy).
# **V2.3 (2026-05-22):** added `ql-collab-ws` for the
# `WebSocketTransport.connect` async binding (this dep stays optional
# for V2.3+ work; ql-collab core stays runtime-agnostic).
# **V2.6 (2026-05-22):** added `BlockingTransport` / `BlockingAckHandle`
# in the engine crate via the `ql-collab/test-fixtures` feature; this
# crate wraps them via the `BlockingTransportFixture` napi class for
# IDE mocha contention tests (closes the V2.4 vacuous-on-Loopback Opus
# MEDIUM-2 finding).
# **V2.8 megaudit closure (Opus-B Lane C HIGH-1, 2026-05-22):** the
# fixture used to ship in every production cdylib because this crate
# enabled `ql-collab/test-fixtures` unconditionally. Lane C escalated
# the previously LOW-rated leak to HIGH because any in-process JS in
# the IDE worker could construct a `BlockingTransportFixture` and park
# tokio blocking-pool threads for up to `u32::MAX` ms — a self-DoS
# surface bypassing the V3 multi-window demo's intended trust boundary.
# Fixed by gating both the `ql-collab` feature dep AND the
# `BlockingTransportFixture` napi class behind a binding-side
# `test-fixtures` feature (see `[features]` below). Production builds
# do NOT enable the feature; mocha/contract builds (dev + CI test
# lane) DO. The `cargo build` invocation that produces a mocha-ready
# cdylib is `cargo build -p ql-bindings-node --release --features test-fixtures`.
ql-collab    = { path = "../ql-collab" }
ql-collab-ws = { path = "../ql-collab-ws" }
ql-oplog     = { path = "../ql-oplog" }
ql-types     = { path = "../ql-types" }
# **Phase 5.7 V3.4.0.4a (2026-05-23):** .qbook persistence napi
# wrappers (`toQbook` / `fromQbook`) delegate to ql-io's
# `save_workbook_with_oplog` + `load_workbook_with_oplog` (Phase 2A.8
# v2 envelope format).  The save path requires a fully-rebuilt
# `Workbook`, so the napi `to_qbook` impl calls
# `inner.rebuild_workbook(&default_registry())` internally -- adding
# `ql-functions` (for `default_registry`) + `ql-storage` (for the
# `Workbook` type) alongside `ql-io` (for the serializer).  Engine-side
# `rebuild_workbook` usage at the napi layer is permitted at V3.4 per
# V3.4.0.1 scope-discovery (V3.4.0.4 plan note); IDE-side `Workbook`
# consumption stays V3.5+ -- the rebuilt Workbook never crosses the
# FFI boundary, it's only used as the save serializer's input.
ql-io        = { path = "../ql-io" }
ql-functions = { path = "../ql-functions" }
ql-storage   = { path = "../ql-storage" }
# **W3 (insert/delete rows & columns):** the structural-edit producer
# (`insertRows` / `deleteRows` / `insertColumns` / `deleteColumns`) computes
# the formula-text shift (`=A5` -> `=A6`) via `shift_formula_text` before
# emitting the `Op::Insert/Delete*` + `Op::PutFormula` BatchCommit (the
# `renameSheet` producer model). Pure lex->parse->shift->print; no FFI types.
ql-formula-syntax = { path = "../ql-formula-syntax" }

# **Phase 6.1B inc.2d (2026-05-27) — owning `WorkbookSession` over napi.**
# The product-neutral engine session contract (`ql-session`: the `EngineSession`
# trait + DTOs + `EngineError`) and its sole implementation
# (`ql_exec::WorkbookSession`). The new `Session` napi class wraps the latter so
# the IDE edit/recalc/snapshot path can run through the owning single-writer
# session instead of the `CollabSession` CRDT façade (decision-lock §2 item 3 /
# risk-mitigation #1: "migrate the Node path early"). `ql-exec` declares NO
# default features (its `xlsx-write` writer + image-codec tree is opt-in), so
# this dep does NOT pull umya/image into the binding's default cdylib.
ql-exec      = { path = "../ql-exec" }
ql-session   = { path = "../ql-session" }
# **6.4-3d (2026-05-29):** the Python-UDF worker (`ProcessWorker` +
# `PythonWorkerConfig`). The `setUdfWorker` napi method builds a `ProcessWorker`
# from a JS config DTO and injects it via `WorkbookSession::set_udf_worker`.
# Now a DIRECT dep, but `ql-exec` already pulls `ql-udf` (and its `arrow`/ipc
# tree) transitively, so this adds NO new external crate to the cdylib.
ql-udf       = { path = "../ql-udf" }

# **V2.4 (2026-05-22):** `parking_lot::Mutex` for the `Arc<Mutex<CoreCollabSession>>`
# refactor that closes V2.3's `&mut self` async aliasing UB hazard. Faster
# than `std::sync::Mutex` (no poison flag, no syscall on uncontended path).
# Already in the dep graph transitively via Loro; declaring directly so
# the binding crate doesn't break if Loro's transitive removes it.
parking_lot = "=0.12.5"

# **V2.4 (2026-05-22):** direct `tokio` dep for the `spawn_blocking`
# pattern used by the V2.4 `flushPendingToTransport` async binding.
# napi-rs's `async` feature pulls tokio transitively, but we use
# `tokio::task::spawn_blocking` directly so a direct dep is cleaner
# (matches CLAUDE.md's "explicit > implicit" pattern).
tokio = { workspace = true }

# **Phase 5.7 V3.2.a (2026-05-22):** the `exportSnapshot` napi method
# returns JSON-serialized cell data so the IDE-side cell-grid widget
# (V3.2.b onward) can render without leaking Loro internals across
# the FFI boundary. `serde` is already in the dep graph transitively
# via ql-oplog's derived `Serialize`/`Deserialize` on `Op` +
# `CellWireValue`; `serde_json` is the explicit JSON writer.
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# **Phase 5.7 V2.8 megaudit closure (Opus-B Lane C HIGH-1, 2026-05-22).**
#
# `test-fixtures`: gates the `BlockingTransportFixture` napi class +
# its Send/Sync compile asserts + the `ql-collab/test-fixtures` feature
# dependency. Off by default → production cdylib does NOT carry the
# fixture. Enable for mocha + contention contract tests:
#
#     cargo build -p ql-bindings-node --release --features test-fixtures
#
# Pre-V2.8 builds enabled `ql-collab/test-fixtures` unconditionally; the
# fixture leaked into every production binary. See V2 exit packet at
# `docs/phase5/5-7-v2-exit-packet.md` for the closure rationale.
[features]
default = []
test-fixtures = ["ql-collab/test-fixtures"]

# **Phase 5.7 V3.6.0.7 D6 profiling spike (2026-05-25)**: criterion bench
# for `workbookSnapshot` cost.  Replicates the napi body in pure Rust
# (napi methods can't be invoked from Cargo bench harnesses without
# bootstrapping a Node runtime) and measures post-D2 + post-D4 cost at
# 1k / 10k / 100k cells × 0/50% format mix × 1/5 sheets.  Decision combo:
# `cells=100 000, format=50 %, sheets=1` median > 50 ms → ship D6.
[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "workbook_snapshot"
harness = false
