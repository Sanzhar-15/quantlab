[package]
name = "ql-bindings-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# **Phase 5.7 V1 (2026-05-22) — VS Code extension binding.**
# Previously a Phase 6+ reserved placeholder (see `ql-bindings-c` for
# the parallel C-FFI placeholder, still reserved). Filled at Phase 5.7
# V1 to bind `CollabSession` for the quantlab VS Code fork's extension
# host (Node.js).
#
# cdylib output for Node.js to load. The build artifact lives at
# `target/{debug,release}/libql_bindings_node.{dylib,so,dll}` per Cargo
# convention. The IDE extension's loader.ts is responsible for finding
# this path (env var `QUANTBOOK_ENGINE_PATH` defaulting to a workspace-
# relative dev location). V2+ will publish via `@napi-rs/cli` or a
# custom artifact pipeline.
#
# Why napi-rs (not wasm or subprocess): see `.plans/_active.md` table.
# tl;dr: only option that preserves the engine's tokio runtime AND
# gives direct memory access for hot paths.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# napi8 feature + default-features = false set at workspace level
# (see workspace Cargo.toml). napi8 targets Node.js 12+ — VS Code's
# electron / Node.js bundle is well past that floor.
napi = { workspace = true }
napi-derive = { workspace = true }

# **V1 scope (per `.plans/_active.md`):** `CollabSession` only.
# **V2.1 + V2.2 (2026-05-22):** added sync Transport surface
# (LoopbackPair + attach/detach/flush*/poll* + AutoFlushPolicy).
# **V2.3 (2026-05-22):** added `ql-collab-ws` for the
# `WebSocketTransport.connect` async binding (this dep stays optional
# for V2.3+ work; ql-collab core stays runtime-agnostic).
# **V2.6 (2026-05-22):** enable `test-fixtures` feature unconditionally
# on the ql-collab dep. This exposes `BlockingTransport` /
# `BlockingAckHandle` in the engine crate, which the cdylib then wraps
# via `BlockingTransportFixture` napi class for IDE mocha contention
# tests (closes the V2.4 vacuous-on-Loopback Opus MEDIUM-2 finding).
# Keeping the feature flag (rather than removing the gate) makes the
# fixture's "not for production" status explicit in the cargo manifest
# + auditable in source greps. V2 backlog: "harden test-fixture
# exposure for production cdylib builds" (post-V2 product hardening).
ql-collab    = { path = "../ql-collab", features = ["test-fixtures"] }
ql-collab-ws = { path = "../ql-collab-ws" }
ql-oplog     = { path = "../ql-oplog" }
ql-types     = { path = "../ql-types" }

# **V2.4 (2026-05-22):** `parking_lot::Mutex` for the `Arc<Mutex<CoreCollabSession>>`
# refactor that closes V2.3's `&mut self` async aliasing UB hazard. Faster
# than `std::sync::Mutex` (no poison flag, no syscall on uncontended path).
# Already in the dep graph transitively via Loro; declaring directly so
# the binding crate doesn't break if Loro's transitive removes it.
parking_lot = "=0.12.5"

# **V2.4 (2026-05-22):** direct `tokio` dep for the `spawn_blocking`
# pattern used by the V2.4 `flushPendingToTransport` async binding.
# napi-rs's `async` feature pulls tokio transitively, but we use
# `tokio::task::spawn_blocking` directly so a direct dep is cleaner
# (matches CLAUDE.md's "explicit > implicit" pattern).
tokio = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
