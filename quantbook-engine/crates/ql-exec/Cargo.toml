[package]
name = "ql-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ql-types          = { path = "../ql-types" }
ql-formula-syntax = { path = "../ql-formula-syntax" }
ql-calcgraph      = { path = "../ql-calcgraph" }
ql-storage        = { path = "../ql-storage" }
ql-functions      = { path = "../ql-functions" }
# Phase 2A.4 (2026-05-12): promoted from dev-dependency. `loader.rs` needs
# `ql_io::load_workbook` at runtime for the `load_workbook_and_recompute`
# convenience. No new transitive risk — ql-io was already linked through
# dev-deps in the same crate.
ql-io             = { path = "../ql-io" }
# Phase 6.1B inc.2c-10 (2026-05-27): xlsx import for `WorkbookSession::import`.
# ql-io-xlsx no longer depends on ql-exec (recompute is injected via its
# `XlsxRecomputer` trait, which `EngineXlsxRecomputer` implements here) — so
# `ql-exec -> ql-io-xlsx` is now acyclic.
# **inc.2c-12 (2026-05-27):** `default-features = false` so the default ql-exec
# build pulls only the xlsx READER (calamine/zip/quick-xml) — NOT the writer's
# heavy umya-spreadsheet + image/rav1e/exr/tiff codec tree. `export("xlsx")`
# lives behind the `xlsx-write` feature below; the writer is opt-in, which keeps
# WASM / bindings (which depend on ql-exec) lean for import-only use. The
# [dev-dependencies] entry re-enables `write` for THIS crate's tests (the import
# round-trip fixture builds via `export_xlsx_path`).
ql-io-xlsx        = { path = "../ql-io-xlsx", default-features = false }
# Phase 6.1B inc.2c-11 (2026-05-27): csv import/export for `WorkbookSession`.
# ql-io-csv is a pure-I/O leaf (deps: csv + ql-storage + ql-types) — CSV has no
# formulas, so there is no recompute injection and no risk of a cycle.
ql-io-csv         = { path = "../ql-io-csv" }
# Phase 2A.3.b (2026-05-12): opt-in op-log attachment for WorkbookRuntime +
# WorkbookTransaction. CellWireValue conversion happens via ql-io (already
# present); Op + OpLog types come from ql-oplog.
ql-oplog          = { path = "../ql-oplog" }
# Phase 6.1B inc.2 (2026-05-26): the binding-neutral EngineSession contract
# (trait + DTOs + EngineError). ql-session depends only on ql-types, so
# ql-exec -> ql-session is acyclic. WorkbookSession (src/session.rs) implements
# the contract here, where Workbook + OpLog + CalcgraphSession + PlanCache +
# FunctionRegistry are already composed (GAP-PS-09 / session-api.md §2.1).
ql-session        = { path = "../ql-session" }
# Phase 6.4-3c (2026-05-29): out-of-process Python-UDF dispatch. `ql-udf` is a
# LEAF crate (deps: ql-types + arrow + thiserror only — NEVER ql-functions/ql-exec)
# implementing the worker transport + Arrow<->Value codec + `UdfWorker` trait
# (6.4-3a/b). The eval layer depends ON it (dependency-inversion, mirroring
# ql-io-csv/ql-io-xlsx): the `RegisteredFn`-dispatch site in `scalar.rs` marshals
# args to an `ArrayValue`, calls a session-injected `&mut dyn UdfWorker`, and maps
# the result/`UdfError` to a cell value. `ql-exec -> ql-udf` is acyclic.
ql-udf            = { path = "../ql-udf" }
# Phase 6.1B inc.2c-6 (2026-05-27): undo/redo. `WorkbookSession` owns a
# `loro::UndoManager` field (constructed via `OpLog::new_undo_manager`), so the
# type must be nameable here. Mirrors ql-collab's Phase 5.4 V1 direct dep for
# the same reason — `loro` is already a transitive dep through ql-oplog; this
# only makes the `UndoManager` type referenceable, no new transitive risk.
loro              = { workspace = true }
# serde_json::Value appears in two EngineSession signatures (publish_dataset /
# materialize_query opaque payloads). Workspace dep, already linked transitively.
serde_json        = { workspace = true }
arrow-array       = { workspace = true }
multiversion      = { workspace = true }
thiserror         = { workspace = true }
# `pulp` is in workspace.dependencies for Phase 4+ kernels that need explicit lane ops
# (Welford reduction with custom lanes, SUMIF masking). W4 SIMD relies on multiversion
# attributes + LLVM auto-vectorization — pulp not yet needed. Adding pulp would pull in
# the unmaintained `paste` transitive (RUSTSEC-2024-0436) which fails cargo-audit.
# Re-add when actually used.

[features]
# **inc.2c-12 (2026-05-27):** opt-in xlsx WRITER. OFF by default — the default
# ql-exec build (and WASM / bindings through it) pulls only the xlsx reader.
# When enabled, turns on `ql-io-xlsx/write` (the umya-spreadsheet writer) and
# `WorkbookSession::export("xlsx")` becomes a real export (else it returns the
# honest `Capability`/`not_implemented_in_v1_core` error). `import("xlsx")` does
# NOT require this feature — the reader is always present.
xlsx-write = ["ql-io-xlsx/write"]

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
tempfile  = { workspace = true }
# **inc.2c-12 (2026-05-27):** the import round-trip TEST
# (`import_xlsx_round_trip_loads_cells_and_recomputes`) builds its `.xlsx`
# fixture via `ql_io_xlsx::export_xlsx_path`, which is behind ql-io-xlsx's
# `write` feature. The normal dependency above is `default-features = false`
# (reader only); this dev-dependency re-enables `write` for THIS crate's test
# builds so the fixture compiles. Cargo unifies the two declarations: `write` is
# present for test/bench builds, absent for the normal lib build.
ql-io-xlsx = { path = "../ql-io-xlsx", features = ["write"] }
# Phase 2B.3: BPC-04 test wires bind-plan-cache stats into Timings to prove
# the visibility contract.
ql-profile = { path = "../ql-profile" }
# Phase 5.3 step 3 (2026-05-20) — row 7 of the conflict-matrix probe
# test (`phase_5_3_conflict_matrix_probe.rs`) asserts the post-repair
# state of formulas authored against concurrently-renamed sheet names.
# Direction: dev-only; ql-collab → ql-exec has no Cargo cycle since
# ql-collab does not depend on ql-exec (they are siblings).
ql-collab  = { path = "../ql-collab" }

# Phase 0 OG-02 hot path bench (Week 4 acceptance run).
[[bench]]
name = "og02_mul2"
harness = false

# Phase 0 OG-04 1M scalar baseline bench.
[[bench]]
name = "og04_scalar_1m"
harness = false

# Phase 0 A7 chunk-size sweep over the OG-02 mul2 hot path.
[[bench]]
name = "og02_chunk_sweep"
harness = false

# Phase 3.10 megaudit A3-03: 10k-formula dirty recompute benchmark.
# Cold edit + idempotent edit (the latter measures the Phase 3.8 VEQ
# short-circuit gain). Regression detection — guards against future
# changes that re-introduce O(n) eval on idempotent edits.
[[bench]]
name = "a3_10k_dirty_recompute"
harness = false
