[package]
name = "ql-io-xlsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# **inc.2c-12 (2026-05-27):** the writer is feature-gated so reader-only
# consumers don't pull umya-spreadsheet + its image/rav1e/exr/tiff codec tree.
# `write` is ON BY DEFAULT for this crate's own builds and tests (which exercise
# round-trip via `export_xlsx_*`). Downstream consumers that need only the
# reader (`ql-exec`'s default build → WASM / bindings) depend with
# `default-features = false` and opt back in via their own feature.
default = ["write"]
# Enables the xlsx WRITER (`export_xlsx_path` / `export_xlsx_bytes`, the `write`
# module, and the `umya-spreadsheet` dependency). The READER
# (calamine/zip/quick-xml + `import_xlsx_*` + `XlsxRecomputer`) is always
# compiled, independent of this feature.
write = ["dep:umya-spreadsheet"]

[dependencies]
# **Phase 4.11 architecture** (locked W5-D-14, 2026-05-18):
# - Hybrid reader: calamine for cell grid + zip/quick-xml for OOXML
#   metadata calamine compresses (scoped names, tables, styles, date1904,
#   feature inventory). See `docs/audits/2026-05-18-phase-4-11-
#   architecture-codex.md` for the full architectural rationale.
# - Writer: umya-spreadsheet for `UpdateOriginal` mode (preserves opaque
#   OOXML parts). rust_xlsxwriter for `NewWorkbook` mode lands later.

# Reader: cell-grid backend (workspace-pinned per Phase 0 audit).
calamine = { workspace = true }

# Hybrid reader OOXML scanner (zip access + streaming XML parse).
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "=0.36.2"

# Writer: round-trip / update-original backend. **inc.2c-12:** optional, gated
# behind the `write` feature (pulls a heavy image/rav1e/exr/tiff codec tree).
umya-spreadsheet = { version = "=2.2.0", optional = true }

# Workspace shared.
ql-storage = { path = "../ql-storage" }
ql-functions = { path = "../ql-functions" }
ql-types = { path = "../ql-types" }
thiserror = { workspace = true }

[dev-dependencies]
# **inc.2c-10 (2026-05-27):** `ql-exec` moved from `[dependencies]` to here to
# break the `ql-exec → ql-io-xlsx → ql-exec` cycle. ql-io-xlsx is now pure I/O
# (formula recompute is injected via the `XlsxRecomputer` trait, implemented by
# `ql-exec`). Tests still recompute through the real engine via this dev-dep,
# using `ql_exec::EngineXlsxRecomputer`. Dev-dependency cycles are permitted by
# Cargo (only normal-dependency cycles are forbidden).
ql-exec = { path = "../ql-exec" }
# Test fixtures live in this crate; tests load .xlsx via ql_io_xlsx itself.
# Phase 4.12 megaudit Opus-A: `opus_a_phase_4_12_ide_proof.rs` exercises the
# IDE proof point (xlsx → .qbook → xlsx) which requires ql-oplog persistence.
ql-oplog = { path = "../ql-oplog" }
# Tier D2 (2026-05-19): the .qbook persistence functions
# (`save_workbook_with_oplog` / `load_workbook_with_oplog`) moved from
# ql-oplog to ql-io. Test imports them from ql-io now.
ql-io = { path = "../ql-io" }
