[package]
name = "ql-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ql-types    = { path = "../ql-types" }
ql-storage  = { path = "../ql-storage" }
# **Tier D2 (2026-05-19) — Phase 4.12 Opus-C HIGH-3 closure:** added
# `ql-oplog` dep. Wire-vocabulary types live in `ql-oplog::wire`;
# `ql-io::oplog_persistence` (formerly `ql-oplog::persistence`) needs
# `OpLog` + `OpLogError` from `ql-oplog`.
ql-oplog    = { path = "../ql-oplog" }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
thiserror   = { workspace = true }
# **Wave H1 (2026-06-19):** single-file `.qbook` container. A `.qbook` is a
# ZIP of the existing dir-bundle members (`workbook.toml`, `sheets/*.jsonl`,
# `oplog.bin`). Pin matches `ql-io-xlsx` (already resolved in Cargo.lock) so no
# new transitive cost; `default-features = false` keeps zip's `time` feature
# OFF (entry timestamps are pinned explicitly for deterministic output).
zip         = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
