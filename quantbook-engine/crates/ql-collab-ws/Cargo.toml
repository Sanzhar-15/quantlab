[package]
name = "ql-collab-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# **Phase 5.5 V2 V3 step 4 (2026-05-21) — WebSocket transport.**
# First production-grade `Transport` impl. Separate crate so
# `ql-collab` core stays runtime-agnostic (no forced tokio dep on
# embedders that don't need WebSockets).
ql-collab         = { path = "../ql-collab" }
tokio             = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
thiserror         = { workspace = true }
# **Phase 5.5 V2 V4 V1 step 3 (2026-05-21) — Tier J3 + K5.**
# Compile-time `assert_impl_all!` proofs for both
# `WebSocketTransport: Sync` and `WebSocketError: Send + Sync`.
# (Originally framed as "assert !Sync" per V2 V3 step 4 docstring,
# but the implementation revealed the type is actually Sync — see
# lib.rs `## Send + Sync` section for the corrected rationale.)
# Zero-cost at runtime; the macros expand to compile-time bound
# checks via a generic helper trait.
static_assertions = { workspace = true }

[dev-dependencies]
# Integration tests need an in-process WebSocket echo server.
# `tokio-tungstenite::accept_async` accepts incoming connections; the
# test fixture (`tests/common/mod.rs`) binds a TcpListener on
# 127.0.0.1:0 and echoes binary frames. ql-collab dev-dep gives
# CollabSession + PeerId for the round-trip integration test.
ql-collab         = { path = "../ql-collab" }
ql-oplog          = { path = "../ql-oplog" }
tokio             = { workspace = true, features = ["test-util"] }
