name: Quantlab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_AUTH_TOKEN: ${{ github.token }}

jobs:
  smoke-build:
    name: Smoke Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Prepare node_modules cache key
        shell: bash
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if command -v 7z.exe &> /dev/null && [ -f .build/node_modules_cache/cache.7z ]; then
              7z.exe x .build/node_modules_cache/cache.7z -aoa
            else
              tar -xzf .build/node_modules_cache/cache.tgz
            fi
          else
            tar -xzf .build/node_modules_cache/cache.tgz
          fi

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libnotify-bin \
            libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
            sleep 2
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Compile
        run: npm run compile

      - name: Verify build
        run: ./scripts/verify-build.sh

      - name: Verify identity
        run: ./scripts/verify-identity.sh

      - name: Verify network surface
        run: ./scripts/verify-network-surface.sh

      - name: Verify marketplace
        env:
          ALLOW_NET_FAIL: 1
        run: ./scripts/verify-marketplace.sh

  package-linux:
    name: Package Linux
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            libsecret-1-dev \
            libnotify-bin \
            libkrb5-dev \
            libgtk-3-0 \
            libgbm1 \
            fakeroot \
            dpkg-dev \
            perl \
            curl \
            python3

      - name: Prepare node_modules cache key
        shell: bash
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          export VSCODE_ARCH=x64
          export npm_config_arch=x64
          source ./build/azure-pipelines/linux/setup-env.sh

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
            sleep 2
          done
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Build Linux package
        run: |
          export VSCODE_ARCH=x64
          export npm_config_arch=x64
          source ./build/azure-pipelines/linux/setup-env.sh
          npm run gulp vscode-linux-x64-min
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64

      - name: Prepare DEB package
        run: |
          export VSCODE_ARCH=x64
          export npm_config_arch=x64
          source ./build/azure-pipelines/linux/setup-env.sh
          npm run gulp vscode-linux-x64-prepare-deb
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64

      - name: Build DEB package
        run: |
          export VSCODE_ARCH=x64
          export npm_config_arch=x64
          source ./build/azure-pipelines/linux/setup-env.sh
          npm run gulp vscode-linux-x64-build-deb
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64

      - name: Verify artifacts
        run: ./scripts/verify-artifacts.sh

      - name: Find artifacts
        id: find-artifacts
        run: |
          if [ -d "../VSCode-linux-x64" ]; then
            echo "tar_dir=../VSCode-linux-x64" >> $GITHUB_OUTPUT
            echo "tar_name=quantlab-linux-x64.tar.gz" >> $GITHUB_OUTPUT
          fi

          DEB_FILE=$(find .build/linux/deb -name "*.deb" -type f 2>/dev/null | head -1)
          if [ -n "$DEB_FILE" ]; then
            echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
            echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
          fi

      - name: Create TAR archive
        if: steps.find-artifacts.outputs.tar_dir != ''
        run: |
          cd ..
          tar -czf quantlab-linux-x64.tar.gz VSCode-linux-x64
          mv quantlab-linux-x64.tar.gz ${{ github.workspace }}/

      - name: Upload TAR artifact
        if: steps.find-artifacts.outputs.tar_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-linux-x64-tar
          path: quantlab-linux-x64.tar.gz

      - name: Upload DEB artifact
        if: steps.find-artifacts.outputs.deb_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-linux-x64-deb
          path: ${{ steps.find-artifacts.outputs.deb_file }}

  package-win:
    name: Package Windows
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Prepare node_modules cache key
        shell: pwsh
        run: |
          mkdir .build -ea 0
          node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache-node-modules
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        shell: pwsh
        run: 7z.exe x .build/node_modules_cache/cache.7z -aoa

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 5; $i++) {
            try {
              npm ci
              break
            }
            catch {
              if ($i -eq 5) {
                Write-Error "npm ci failed after 5 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -Force .build/node_modules_cache
          7z.exe a .build/node_modules_cache/cache.7z -mx3 `@.build/node_modules_list.txt

      - name: Build Windows package
        run: |
          npm run gulp vscode-win32-x64-min

      - name: Verify product.json identity
        shell: pwsh
        run: |
          $productPath = if (Test-Path "VSCode-win32-x64\resources\app\product.json") { "VSCode-win32-x64\resources\app\product.json" } elseif (Test-Path "..\VSCode-win32-x64\resources\app\product.json") { "..\VSCode-win32-x64\resources\app\product.json" } else { throw "product.json not found" }
          $product = Get-Content $productPath | ConvertFrom-Json
          $identity = @{}
          Get-Content "config\quantlab.identity.env" | ForEach-Object { if ($_ -match '^([^=]+)=(.*)$') { $identity[$matches[1].Trim()] = $matches[2].Trim() } }
          $errors = @()
          if ($product.nameShort -ne $identity.APP_NAME) { $errors += "nameShort mismatch: $($product.nameShort) vs $($identity.APP_NAME)" }
          if ($product.applicationName -ne $identity.APPLICATION_NAME) { $errors += "applicationName mismatch: $($product.applicationName) vs $($identity.APPLICATION_NAME)" }
          if ($errors.Count -gt 0) { Write-Error "Verification failed: $($errors -join ', ')"; exit 1 } else { Write-Host "Product.json identity verified" }

      - name: Find artifact
        id: find-artifact
        run: |
          $dir = "VSCode-win32-x64"
          if (Test-Path $dir) {
            Write-Host "artifact_dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "artifact_name=quantlab-win32-x64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create ZIP archive
        if: steps.find-artifact.outputs.artifact_dir != ''
        run: |
          Compress-Archive -Path ${{ steps.find-artifact.outputs.artifact_dir }} -DestinationPath quantlab-win32-x64.zip -Force

      - name: Upload artifact
        if: steps.find-artifact.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-win32-x64
          path: quantlab-win32-x64.zip

  package-mac:
    name: Package macOS
    runs-on: macos-13
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Prepare node_modules cache key
        run: mkdir -p .build && node build/azure-pipelines/common/computeNodeModulesCacheKey.ts compile $(node -p process.arch) > .build/packagelockhash

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache/restore@v5
        with:
          path: .build/node_modules_cache
          key: "node_modules-compile-${{ hashFiles('.build/packagelockhash') }}"

      - name: Extract node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit == 'true'
        run: tar -xzf .build/node_modules_cache/cache.tgz

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
            sleep 2
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_AUTH_TOKEN: ${{ github.token }}

      - name: Create node_modules archive
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          node build/azure-pipelines/common/listNodeModules.ts .build/node_modules_list.txt
          mkdir -p .build/node_modules_cache
          tar -czf .build/node_modules_cache/cache.tgz --files-from .build/node_modules_list.txt

      - name: Build macOS package
        run: |
          npm run gulp vscode-darwin-x64-min

      - name: Verify product.json identity
        run: |
          APP_BUNDLE="VSCode-darwin-x64/Quantlab.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE=$(find VSCode-darwin-x64 -name "*.app" -type d | head -1)
            if [ -z "$APP_BUNDLE" ]; then
              echo "Error: .app bundle not found in VSCode-darwin-x64"
              exit 1
            fi
          fi
          node -e "const product = require('./$APP_BUNDLE/Contents/Resources/app/product.json'); const fs = require('fs'); const identity = {}; fs.readFileSync('config/quantlab.identity.env', 'utf8').split('\n').forEach(line => { const match = line.match(/^([^=]+)=(.*)$/); if (match) identity[match[1].trim()] = match[2].trim(); }); const errors = []; if (product.nameShort !== identity.APP_NAME) errors.push('nameShort mismatch: ' + product.nameShort + ' vs ' + identity.APP_NAME); if (product.applicationName !== identity.APPLICATION_NAME) errors.push('applicationName mismatch: ' + product.applicationName + ' vs ' + identity.APPLICATION_NAME); if (errors.length) { console.error('Verification failed:', errors); process.exit(1); } else { console.log('Product.json identity verified'); }"

      - name: Find artifact
        id: find-artifact
        run: |
          if [ -d "VSCode-darwin-x64" ]; then
            echo "artifact_dir=VSCode-darwin-x64" >> $GITHUB_OUTPUT
            echo "artifact_name=quantlab-darwin-x64" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP archive
        if: steps.find-artifact.outputs.artifact_dir != ''
        run: |
          cd ..
          zip -r quantlab-darwin-x64.zip VSCode-darwin-x64
          mv quantlab-darwin-x64.zip ${{ github.workspace }}/

      - name: Upload artifact
        if: steps.find-artifact.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-darwin-x64
          path: quantlab-darwin-x64.zip

