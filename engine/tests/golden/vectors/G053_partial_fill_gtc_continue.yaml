# G053: Partial Fill GTC Continues Next Bar
# Category: partial_fills
# Verifies: GTC order with partial fill continues filling next bar

id: G053
name: "Partial fill GTC continues"
category: partial_fills
description: |
  A GTC order that partially fills due to volume limits should
  continue filling on subsequent bars until complete.

tags:
  - volume
  - partial_fill
  - gtc
  - multi_bar

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none
  max_volume_participation: 0.10  # 10% of volume

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    # 10% of 500 = 50 shares max fill
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 500}
    # 10% of 800 = 80 shares max fill
    - {date: "2026-01-06", open: "103.00", high: "105.00", low: "101.00", close: "104.00", volume: 800}

signals:
  # GTC order for 100 shares - will fill across multiple bars
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
    time_in_force: gtc

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "50"  # 10% of 500
      price: "104.50"
      side: buy
    - bar_index: 2
      symbol: AAPL
      quantity: "50"  # Remaining 50 (< 10% of 800)
      price: "103.00"
      side: buy

  # Total cost: 50*104.50 + 50*103 = 5225 + 5150 = 10375
  final_cash: "89625.00"  # 100000 - 10375
  final_positions:
    AAPL: "100"
  final_equity: "100025.00"  # 89625 + (100 * 104)

  metrics:
    total_return: "0.00025"
    total_trades: 2
