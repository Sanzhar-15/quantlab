# CM003: Code Modification Syntax Error Prevention
# Category: codemod
# Verifies: Syntax errors prevent code write

id: CM003
name: "Syntax error prevents code modification write"
category: codemod
description: |
  If code modification would result in invalid Python syntax,
  the write should be prevented and an error returned.

tags:
  - codemod
  - syntax
  - validation

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy

  final_cash: "89550.00"
  final_positions:
    AAPL: "100"
  final_equity: "99850.00"

  metrics:
    total_return: "-0.0015"
    total_trades: 1

  codemod:
    syntax_validated: true
    invalid_syntax_rejected: true
