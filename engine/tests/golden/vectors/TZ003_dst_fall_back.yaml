# TZ003: DST Fall Back
# Category: timezone
# Verifies: DST fall back handled correctly

id: TZ003
name: "DST fall back transition"
category: timezone
description: |
  Daylight Saving Time fall back transition should be
  handled correctly without missing or duplicate bars.

tags:
  - timezone
  - dst
  - fall

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    # Around DST fall back (November 1, 2026)
    - {date: "2026-10-30", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-11-02", open: "101.50", high: "103.00", low: "100.00", close: "102.00", volume: 1100000}
    - {date: "2026-11-03", open: "102.50", high: "104.00", low: "101.00", close: "103.00", volume: 1200000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "101.50"
      side: buy

  final_cash: "89850.00"
  final_positions:
    AAPL: "100"
  final_equity: "100150.00"

  metrics:
    total_return: "0.0015"
    total_trades: 1

  timezone:
    no_missing_bars: true
    no_duplicate_bars: true
