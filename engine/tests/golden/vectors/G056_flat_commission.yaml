# G056: Flat Commission per Trade
# Category: slippage
# Verifies: Fixed commission charged per trade regardless of size

id: G056
name: "Flat commission per trade"
category: slippage
description: |
  Tests flat commission model where a fixed dollar amount is charged
  per trade regardless of order size.

tags:
  - commission
  - flat
  - cost_model

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: flat
    rate: "9.95"  # $9.95 per trade

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "100.00", high: "103.00", low: "99.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "102.50", high: "105.00", low: "101.00", close: "104.00", volume: 1100000}
    - {date: "2026-01-07", open: "104.00", high: "106.00", low: "103.00", close: "105.00", volume: 900000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "100.00"
      side: buy
      commission: "9.95"
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "104.00"
      side: sell
      commission: "9.95"

  final_cash: "100380.10"  # 100000 - 10000 - 9.95 + 10400 - 9.95
  final_positions: {}
  final_equity: "100380.10"

  metrics:
    total_return: "0.003801"
    total_trades: 2
