# G085: Sell More Than Owned (No Shorting)
# Category: edge_cases
# Verifies: Sell order limited to owned quantity when shorting disabled

id: G085
name: "Sell more than owned no shorting"
category: edge_cases
description: |
  When shorting is disabled, a sell order for more shares than
  owned should be limited to the owned quantity or rejected.

tags:
  - edge_case
  - sell_limit
  - no_shorting

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none
  allow_shorting: false

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}
    - {date: "2026-01-06", open: "103.00", high: "108.00", low: "101.00", close: "107.00", volume: 900000}

signals:
  # Buy 50 shares
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "50"
    order_type: market
  # Try to sell 100 shares (only own 50)
  - bar_index: 1
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "50"
      price: "104.50"
      side: buy
    # Should only sell what we own (50), not create short
    - bar_index: 2
      symbol: AAPL
      quantity: "50"
      price: "103.00"
      side: sell

  # Buy: 50 * 104.50 = 5225
  # Sell: 50 * 103 = 5150
  # Net: 100000 - 5225 + 5150 = 99925
  final_cash: "99925.00"
  final_positions: {}
  final_equity: "99925.00"

  metrics:
    total_return: "-0.00075"
    total_trades: 2
