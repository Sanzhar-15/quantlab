# G002: Basic Market Sell Order
# Category: basic_execution
# Verifies: Market sell order (close position) fills at next bar open price

id: G002
name: "Basic market sell order"
category: basic_execution
description: |
  A market sell order to close a long position should fill at the next bar's open price.
  This tests selling mechanics with t/t+1 semantics.

tags:
  - market_order
  - basic

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "105.00", volume: 1200000}
    - {date: "2026-01-06", open: "105.50", high: "108.00", low: "104.00", close: "107.00", volume: 900000}
    - {date: "2026-01-07", open: "107.00", high: "109.00", low: "106.00", close: "108.00", volume: 1100000}

signals:
  # Buy at bar 0, sell at bar 2
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "107.00"
      side: sell

  final_cash: "100250.00"  # 100000 - 10450 + 10700
  final_positions: {}
  final_equity: "100250.00"

  metrics:
    total_return: "0.0025"
    total_trades: 2
    win_rate: "1.0"
