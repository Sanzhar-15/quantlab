# G006: Complete Round Trip with Loss
# Category: basic_execution
# Verifies: Buy then sell sequence with realized loss

id: G006
name: "Round trip trade with loss"
category: basic_execution
description: |
  Buy 100 shares, then sell 100 shares at a lower price.
  Tests loss calculation and position closure.

tags:
  - round_trip
  - loss
  - basic

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.50", high: "103.00", low: "100.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "101.00", high: "102.00", low: "96.00", close: "97.00", volume: 2000000}
    - {date: "2026-01-07", open: "96.00", high: "98.00", low: "94.00", close: "95.00", volume: 1800000}
    - {date: "2026-01-08", open: "95.50", high: "97.00", low: "94.00", close: "96.00", volume: 1100000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "101.50"
      side: buy
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "96.00"
      side: sell

  final_cash: "99450.00"  # 100000 - 10150 + 9600
  final_positions: {}
  final_equity: "99450.00"

  metrics:
    total_return: "-0.0055"
    total_trades: 2
