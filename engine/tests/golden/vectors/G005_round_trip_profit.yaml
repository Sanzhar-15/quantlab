# G005: Complete Round Trip with Profit
# Category: basic_execution
# Verifies: Buy then sell sequence with realized profit

id: G005
name: "Round trip trade with profit"
category: basic_execution
description: |
  Buy 100 shares, then sell 100 shares at a higher price.
  Tests complete trade lifecycle and P&L calculation.

tags:
  - round_trip
  - profit
  - basic

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.50", high: "104.00", low: "100.00", close: "103.00", volume: 1200000}
    - {date: "2026-01-06", open: "103.50", high: "108.00", low: "102.00", close: "107.00", volume: 1500000}
    - {date: "2026-01-07", open: "108.00", high: "110.00", low: "106.00", close: "109.00", volume: 1100000}
    - {date: "2026-01-08", open: "109.50", high: "111.00", low: "108.00", close: "110.00", volume: 900000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "101.50"
      side: buy
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "108.00"
      side: sell

  final_cash: "100650.00"  # 100000 - 10150 + 10800
  final_positions: {}
  final_equity: "100650.00"

  metrics:
    total_return: "0.0065"
    total_trades: 2
