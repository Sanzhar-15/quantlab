# G015: Stop Limit Buy Order
# Category: order_types
# Verifies: Stop limit buy triggers at stop, fills at limit or better

id: G015
name: "Stop limit buy order"
category: order_types
description: |
  A stop limit buy triggers when price reaches stop, but only fills
  if the price is at or below the limit. Provides price protection
  on breakout entries.

tags:
  - stop_limit
  - order_types
  - advanced

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.00", high: "103.00", low: "100.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "102.00", high: "106.00", low: "101.50", close: "104.00", volume: 1800000}
    - {date: "2026-01-07", open: "103.50", high: "107.00", low: "103.00", close: "106.00", volume: 1500000}

signals:
  # Stop at 105, limit at 105.50 - triggers and fills on bar 2
  # Using GTC so order persists until triggered
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: stop_limit
    stop_price: "105.00"
    limit_price: "105.50"
    time_in_force: gtc

expected:
  fills:
    - bar_index: 2
      symbol: AAPL
      quantity: "100"
      price: "105.00"
      side: buy

  final_cash: "89500.00"
  final_positions:
    AAPL: "100"
  final_equity: "100100.00"  # 89500 + (100 * 106)

  metrics:
    total_return: "0.001"
    total_trades: 1
