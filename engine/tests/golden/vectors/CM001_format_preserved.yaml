# CM001: Code Modification Format Preservation
# Category: codemod
# Verifies: LibCST preserves formatting after parameter modification

id: CM001
name: "Format preserved after parameter modification"
category: codemod
description: |
  Code modification using LibCST should preserve all formatting,
  including whitespace, comments, and indentation.

tags:
  - codemod
  - libcst
  - formatting

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy

  final_cash: "89550.00"
  final_positions:
    AAPL: "100"
  final_equity: "99850.00"

  metrics:
    total_return: "-0.0015"
    total_trades: 1

  # Code modification specific checks
  codemod:
    original_has_comments: true
    modified_has_comments: true
    whitespace_preserved: true
