# G055: Per-Share Commission
# Category: slippage
# Verifies: Commission charged per share traded

id: G055
name: "Per-share commission model"
category: slippage
description: |
  Tests per-share commission model where a fixed amount is charged
  for each share traded.

tags:
  - commission
  - per_share
  - cost_model

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: per_share
    rate: "0.005"  # $0.005 per share

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "100.00", high: "103.00", low: "99.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "102.50", high: "105.00", low: "101.00", close: "104.00", volume: 1100000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "1000"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "1000"
      price: "100.00"
      side: buy
      commission: "5.00"  # 1000 * 0.005

  final_cash: "-5.00"  # 100000 - 100000 - 5
  final_positions:
    AAPL: "1000"
  final_equity: "103995.00"  # -5 + (1000 * 104)

  metrics:
    total_return: "0.03995"
    total_trades: 1
