# G086: Duplicate Signals Same Bar
# Category: edge_cases
# Verifies: Multiple identical signals handled correctly

id: G086
name: "Duplicate signals same bar"
category: edge_cases
description: |
  Multiple identical buy signals on the same bar should either
  be deduplicated or create separate orders based on configuration.

tags:
  - edge_case
  - duplicate
  - signal

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}

signals:
  # Two identical buy signals on same bar
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "50"
    order_type: market
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "50"
    order_type: market

expected:
  fills:
    # Both orders fill (separate orders)
    - bar_index: 1
      symbol: AAPL
      quantity: "50"
      price: "104.50"
      side: buy
    - bar_index: 1
      symbol: AAPL
      quantity: "50"
      price: "104.50"
      side: buy

  # 2 * (50 * 104.50) = 10450
  final_cash: "89550.00"
  final_positions:
    AAPL: "100"
  final_equity: "99850.00"  # 89550 + (100 * 103)

  metrics:
    total_return: "-0.0015"
    total_trades: 2
