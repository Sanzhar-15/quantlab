# G052: Volume Participation Partial Fill
# Category: partial_fills
# Verifies: Order partially fills based on volume participation limit

id: G052
name: "Volume participation partial fill"
category: partial_fills
description: |
  When order size exceeds max volume participation, only the
  allowed portion should fill, with remainder cancelled for IOC
  or carried forward for GTC.

tags:
  - volume
  - partial_fill
  - volume_participation

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none
  max_volume_participation: "0.05"  # 5% of volume

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    # Low volume bar - 10K volume, 5% = 500 shares max
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 10000}

signals:
  # Try to buy 800 shares, but only 500 (5% of 10K) can fill
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "800"
    order_type: market
    time_in_force: ioc

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "500"  # Only 5% of 10K volume
      price: "104.50"
      side: buy

  # 500 * 104.50 = 52,250
  final_cash: "47750.00"  # 100000 - 52250
  final_positions:
    AAPL: "500"
  final_equity: "99250.00"  # 47750 + (500 * 103)

  metrics:
    total_return: "-0.0075"
    total_trades: 1
