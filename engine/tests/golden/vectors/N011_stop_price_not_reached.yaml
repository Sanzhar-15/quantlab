---
# N011: Stop order price never reached
# Tests that stop orders don't fill when trigger price isn't reached
# Spec Reference: Technical Spec §4.2 (Order Types)

name: "Stop Order Not Triggered"
description: |
  Verify that a stop order remains pending when the stop price
  is not reached during the execution bar.

config:
  initial_cash: "100000.00"
  commission_model: "none"
  fill_assumption: "next_open"
  allow_short: true

data:
  SPY:
    - timestamp: "2024-01-02T09:30:00"
      open: "480.00"
      high: "485.00"
      low: "478.00"
      close: "483.00"
      volume: 50000000
    - timestamp: "2024-01-03T09:30:00"
      open: "483.00"
      high: "486.00"  # High doesn't reach stop of 490
      low: "481.00"
      close: "484.00"
      volume: 52000000
    - timestamp: "2024-01-04T09:30:00"
      open: "484.00"
      high: "487.00"
      low: "482.00"
      close: "485.00"
      volume: 53000000

signals:
  - bar_index: 0
    symbol: "SPY"
    side: "buy"
    order_type: "stop"
    quantity: "50"
    stop_price: "490.00"  # Buy stop above market (never reached)

expected:
  final_cash: "100000.00"
  final_positions:
    SPY: "0"
  trades_count: 0
  orders_pending: 1
  stop_triggered: false
