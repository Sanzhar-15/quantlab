# G071: Multi-Symbol Rebalance
# Category: multi_symbol
# Verifies: Simultaneous sell and buy for rebalancing

id: G071
name: "Multi-symbol rebalance"
category: multi_symbol
description: |
  Rebalancing across multiple symbols - selling one position
  and buying another in the same bar.

tags:
  - multi_symbol
  - rebalance
  - rotation

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbols:
    - symbol: AAPL
      timeframe: 1d
      bars:
        - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
        - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}
        - {date: "2026-01-06", open: "103.00", high: "108.00", low: "102.00", close: "107.00", volume: 900000}
        - {date: "2026-01-07", open: "107.00", high: "110.00", low: "106.00", close: "109.00", volume: 850000}
    - symbol: MSFT
      timeframe: 1d
      bars:
        - {date: "2026-01-02", open: "400.00", high: "410.00", low: "395.00", close: "405.00", volume: 800000}
        - {date: "2026-01-05", open: "406.00", high: "415.00", low: "400.00", close: "412.00", volume: 900000}
        - {date: "2026-01-06", open: "413.00", high: "420.00", low: "410.00", close: "418.00", volume: 750000}
        - {date: "2026-01-07", open: "418.00", high: "425.00", low: "415.00", close: "422.00", volume: 700000}

signals:
  # Buy AAPL initially
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  # Rebalance: sell AAPL, buy MSFT
  - bar_index: 2
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: buy
    symbol: MSFT
    quantity: "25"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "107.00"
      side: sell
    - bar_index: 3
      symbol: MSFT
      quantity: "25"
      price: "418.00"
      side: buy

  # Start: 100000
  # Buy AAPL: -10450 = 89550
  # Sell AAPL: +10700 = 100250
  # Buy MSFT: -10450 = 89800
  final_cash: "89800.00"
  final_positions:
    MSFT: "25"
  final_equity: "100350.00"  # 89800 + (25 * 422)

  metrics:
    total_return: "0.0035"
    total_trades: 3
