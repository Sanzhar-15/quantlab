# G023: GTC Order Multi-Day Fill
# Category: time_in_force
# Verifies: GTC limit order fills after multiple days

id: G023
name: "GTC order multi-day fill"
category: time_in_force
description: |
  A GTC (Good Till Cancelled) limit order should remain active across
  multiple trading days until filled or cancelled.

tags:
  - gtc
  - limit
  - multi_day
  - tif

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.00", high: "106.00", low: "103.00", close: "105.00", volume: 1200000}
    - {date: "2026-01-06", open: "105.00", high: "107.00", low: "104.00", close: "106.00", volume: 900000}
    - {date: "2026-01-07", open: "106.00", high: "108.00", low: "105.00", close: "107.00", volume: 850000}
    # Finally drops low enough to fill
    - {date: "2026-01-08", open: "105.00", high: "106.00", low: "94.00", close: "95.00", volume: 2000000}

signals:
  # GTC limit buy at 95 - won't fill for several days
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: limit
    limit_price: "95.00"
    time_in_force: gtc

expected:
  fills:
    # Fills on bar 4 when low reaches 94 < limit 95
    - bar_index: 4
      symbol: AAPL
      quantity: "100"
      price: "95.00"
      side: buy

  final_cash: "90500.00"  # 100000 - (100 * 95)
  final_positions:
    AAPL: "100"
  final_equity: "100000.00"  # 90500 + (100 * 95)

  metrics:
    total_return: "0"
    total_trades: 1
