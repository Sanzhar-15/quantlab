# UNI002: Unicode Filename Handling
# Category: unicode
# Verifies: Unicode filenames handled correctly

id: UNI002
name: "Unicode filename handled correctly"
category: unicode
description: |
  Filenames containing unicode characters (e.g., CJK characters)
  should be handled correctly for data loading and hashing.

tags:
  - unicode
  - filename
  - cjk

