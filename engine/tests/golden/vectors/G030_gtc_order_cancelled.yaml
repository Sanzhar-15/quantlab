# G030: GTC Order Cancelled Before Fill
# Category: order_types
# Verifies: GTC order can be cancelled before filling

id: G030
name: "GTC order cancelled before fill"
category: order_types
description: |
  A GTC (Good Til Cancelled) order that is explicitly cancelled
  should not fill even if conditions are later met.

tags:
  - gtc
  - cancel
  - order_types

skip: true
skip_reason: "Cancel order functionality not fully implemented"

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.00", high: "103.00", low: "100.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "95.00", high: "97.00", low: "94.00", close: "96.00", volume: 1500000}

signals:
  # Place limit buy at 96
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: limit
    limit_price: "96.00"
    time_in_force: gtc
  # Cancel on bar 1 (before price drops to fill level)
  - bar_index: 1
    action: cancel
    symbol: AAPL

expected:
  fills: []

  final_cash: "100000.00"
  final_positions: {}
  final_equity: "100000.00"

  metrics:
    total_return: "0"
    total_trades: 0
