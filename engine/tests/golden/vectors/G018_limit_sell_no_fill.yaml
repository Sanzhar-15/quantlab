# G018: Limit Sell Order No Fill
# Category: order_types
# Verifies: Limit sell doesn't fill if price never reaches limit

id: G018
name: "Limit sell order no fill"
category: order_types
description: |
  A limit sell order should not fill if the high price never
  reaches the limit price during the order's lifetime.

tags:
  - limit
  - sell
  - no_fill
  - order_types

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}
    - {date: "2026-01-06", open: "103.00", high: "105.00", low: "101.00", close: "102.00", volume: 900000}

signals:
  # Buy first
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  # Limit sell at 110 - will not fill since high only reaches 105
  - bar_index: 1
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: limit
    limit_price: "110.00"

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy
    # No sell fill - limit not reached

  final_cash: "89550.00"  # 100000 - 10450
  final_positions:
    AAPL: "100"
  final_equity: "99750.00"  # 89550 + (100 * 102)

  metrics:
    total_return: "-0.0025"
    total_trades: 1
