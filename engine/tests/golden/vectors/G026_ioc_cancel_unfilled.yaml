# G026: IOC Order Cancel Unfilled
# Category: time_in_force
# Verifies: IOC limit order cancels unfilled portion immediately

id: G026
name: "IOC order cancels unfilled"
category: time_in_force
description: |
  An IOC limit order that cannot fill (price not reached) should
  be cancelled immediately with no fill.

tags:
  - ioc
  - limit
  - cancel
  - tif

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    # Price never drops to limit
    - {date: "2026-01-05", open: "104.50", high: "108.00", low: "103.00", close: "107.00", volume: 1200000}

signals:
  # IOC limit buy at 95 - price doesn't reach, should cancel immediately
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: limit
    limit_price: "95.00"
    time_in_force: ioc

expected:
  fills: []
  # No fill, order cancelled

  final_cash: "100000.00"
  final_positions: {}
  final_equity: "100000.00"

  metrics:
    total_return: "0"
    total_trades: 0
