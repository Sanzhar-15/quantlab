# G003: Market Buy with Gap Up
# Category: basic_execution
# Verifies: Market order fills at gap-up open price

id: G003
name: "Market buy with gap up opening"
category: basic_execution
description: |
  Market buy order fills at next bar open even when there's a gap up.
  Tests that execution price reflects actual market conditions.

tags:
  - market_order
  - gap
  - basic

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "110.00", high: "112.00", low: "108.00", close: "111.00", volume: 2000000}
    - {date: "2026-01-06", open: "111.50", high: "115.00", low: "110.00", close: "114.00", volume: 1500000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "50"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "50"
      price: "110.00"
      side: buy

  final_cash: "94500.00"  # 100000 - (50 * 110)
  final_positions:
    AAPL: "50"
  final_equity: "100200.00"  # 94500 + (50 * 114)

  metrics:
    total_return: "0.002"
    total_trades: 1
