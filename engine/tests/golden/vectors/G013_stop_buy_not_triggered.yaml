# G013: Stop Buy Order - Not Triggered
# Category: order_types
# Verifies: Stop buy order doesn't trigger if price never reaches stop

id: G013
name: "Stop buy order not triggered"
category: order_types
description: |
  A stop buy order should not trigger if the price never reaches the stop level.
  Order remains pending and expires unfilled.

tags:
  - stop_order
  - order_types
  - no_fill

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.00", high: "103.00", low: "100.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "101.50", high: "104.00", low: "100.00", close: "103.00", volume: 1100000}
    - {date: "2026-01-07", open: "102.00", high: "104.50", low: "101.00", close: "104.00", volume: 900000}

signals:
  # Stop buy at 110 - never triggers as high never reaches 110
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: stop
    stop_price: "110.00"

expected:
  fills: []

  final_cash: "100000.00"
  final_positions: {}
  final_equity: "100000.00"

  metrics:
    total_return: "0"
    total_trades: 0
