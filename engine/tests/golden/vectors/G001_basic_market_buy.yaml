# G001: Basic Market Buy Order
# Category: basic_execution
# Verifies: Market buy order fills at next bar open price

id: G001
name: "Basic market buy order"
category: basic_execution
description: |
  A market buy order submitted at bar close should fill at the next bar's open price.
  This tests the fundamental t/t+1 signal/execution bar semantics.

tags:
  - market_order
  - basic

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}
    - {date: "2026-01-06", open: "103.00", high: "107.00", low: "101.00", close: "106.00", volume: 900000}

signals:
  # Signal generated at bar 0 close, executes at bar 1 open
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy
      commission: "0"
      slippage: "0"

  final_cash: "89550.00"  # 100000 - (100 * 104.50)
  final_positions:
    AAPL: "100"
  final_equity: "100150.00"  # 89550 + (100 * 106.00)

  metrics:
    total_return: "0.0015"
    total_trades: 1
