# G042: Short Sell with Loss
# Category: short_selling
# Verifies: Short sell then cover at higher price for loss

id: G042
name: "Short sell with loss on cover"
category: short_selling
description: |
  Short sell shares, then cover at a higher price to realize loss.
  Tests short position loss calculation when price moves against.

tags:
  - short_sell
  - cover
  - loss

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
    - {date: "2026-01-05", open: "101.50", high: "103.00", low: "100.00", close: "102.00", volume: 1200000}
    - {date: "2026-01-06", open: "103.00", high: "108.00", low: "102.00", close: "107.00", volume: 2000000}
    - {date: "2026-01-07", open: "108.00", high: "110.00", low: "106.00", close: "109.00", volume: 1800000}
    - {date: "2026-01-08", open: "109.50", high: "111.00", low: "108.00", close: "110.00", volume: 1500000}

signals:
  - bar_index: 0
    action: sell
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 2
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "101.50"
      side: sell
    - bar_index: 3
      symbol: AAPL
      quantity: "100"
      price: "108.00"
      side: buy

  final_cash: "99350.00"  # 100000 + 10150 - 10800
  final_positions: {}
  final_equity: "99350.00"

  metrics:
    total_return: "-0.0065"
    total_trades: 2
