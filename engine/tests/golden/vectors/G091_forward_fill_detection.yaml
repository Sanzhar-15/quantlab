# G091: Forward Fill Detection
# Category: forward_fill
# Verifies: Forward-filled bars are detected and handled

id: G091
name: "Forward fill detection"
category: forward_fill
description: |
  Bars with identical OHLC values to the previous bar should be
  detected as forward-filled and optionally flagged.

tags:
  - forward_fill
  - detection
  - data_quality

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none
  detect_forward_fill: true

data:
  symbol: AAPL
  timeframe: 1d
  bars:
    - {date: "2026-01-02", open: "100.00", high: "105.00", low: "99.00", close: "104.00", volume: 1000000}
    - {date: "2026-01-05", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 1200000}
    # Forward-filled bar (identical to previous)
    - {date: "2026-01-06", open: "104.50", high: "106.00", low: "102.00", close: "103.00", volume: 0}
    - {date: "2026-01-07", open: "105.00", high: "108.00", low: "104.00", close: "107.00", volume: 850000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "104.50"
      side: buy

  final_cash: "89550.00"
  final_positions:
    AAPL: "100"
  final_equity: "100250.00"  # 89550 + (100 * 107)

  warnings:
    - type: forward_fill_detected
      bar_index: 2
      symbol: AAPL

  metrics:
    total_return: "0.0025"
    total_trades: 1
