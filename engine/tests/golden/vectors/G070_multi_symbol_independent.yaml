# G070: Multi-Symbol Independent Trades
# Category: multi_symbol
# Verifies: Multiple symbols can be traded independently

id: G070
name: "Multi-symbol independent trades"
category: multi_symbol
description: |
  Tests trading multiple symbols independently with separate positions
  and P&L tracking.

tags:
  - multi_symbol
  - portfolio
  - independent

setup:
  initial_cash: "100000"
  calendar: nyse
  fill_assumption: next_open
  slippage:
    model: none
  commission:
    model: none

data:
  symbols:
    - symbol: AAPL
      timeframe: 1d
      bars:
        - {date: "2026-01-02", open: "100.00", high: "102.00", low: "99.00", close: "101.00", volume: 1000000}
        - {date: "2026-01-05", open: "101.00", high: "104.00", low: "100.00", close: "103.00", volume: 1200000}
        - {date: "2026-01-06", open: "103.50", high: "106.00", low: "102.00", close: "105.00", volume: 1100000}
    - symbol: GOOGL
      timeframe: 1d
      bars:
        - {date: "2026-01-02", open: "150.00", high: "153.00", low: "149.00", close: "152.00", volume: 800000}
        - {date: "2026-01-05", open: "152.50", high: "156.00", low: "151.00", close: "155.00", volume: 900000}
        - {date: "2026-01-06", open: "155.50", high: "158.00", low: "154.00", close: "157.00", volume: 850000}

signals:
  - bar_index: 0
    action: buy
    symbol: AAPL
    quantity: "100"
    order_type: market
  - bar_index: 0
    action: buy
    symbol: GOOGL
    quantity: "50"
    order_type: market

expected:
  fills:
    - bar_index: 1
      symbol: AAPL
      quantity: "100"
      price: "101.00"
      side: buy
    - bar_index: 1
      symbol: GOOGL
      quantity: "50"
      price: "152.50"
      side: buy

  final_cash: "82275.00"  # 100000 - (100*101) - (50*152.50)
  final_positions:
    AAPL: "100"
    GOOGL: "50"
  final_equity: "100625.00"  # 82275 + (100*105) + (50*157)

  metrics:
    total_return: "0.00625"
    total_trades: 2
