[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab-engine"
version = "1.0.0a1"
description = "Quantlab trading engine - backtesting and live trading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Quantlab Team" }
]
keywords = ["trading", "backtesting", "quantitative-finance", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    # Core data processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",

    # Code modification (LibCST for formatting-preserving AST)
    "libcst>=1.1.0",

    # Cryptography (for encrypted secrets fallback)
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",

    # System utilities
    "psutil>=5.9.0",

    # Calendar and timezone (YAML parsing)
    "pyyaml>=6.0",

    # Alpaca broker/data integration
    "alpaca-py>=0.20.0",

    # HTTP client for API calls
    "httpx>=0.25.0",

    # JSON-RPC protocol
    "jsonrpclib-pelix>=0.4.3",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "pytest-xdist>=3.3.0",

    # Type checking
    "pyright>=1.1.340",

    # Linting and formatting
    "ruff>=0.1.6",

    # Mocking
    "responses>=0.24.0",
    "freezegun>=1.2.0",
]

benchmark = [
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.61.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/quantlab/quantlab"
Documentation = "https://quantlab.github.io/quantlab"
Repository = "https://github.com/quantlab/quantlab"
Issues = "https://github.com/quantlab/quantlab/issues"

[project.scripts]
quantlab-engine = "quantlab.daemon.main:main"

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["quantlab"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "golden: Golden test vectors (G001-G105)",
    "live: Live trading tests (L001-L070)",
    "benchmark: Performance benchmark tests",
    "chaos: Chaos/failure injection tests",
    "slow: Tests that take >1 second",
    "integration: Integration tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["quantlab"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["quantlab", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",    # Unused arguments OK in tests (fixtures)
    "PLR2004", # Magic values OK in tests
]

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["quantlab"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".git",
]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportPrivateUsage = true
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportOverlappingOverload = true
reportMissingSuperCall = false
reportUninitializedInstanceVariable = true
reportInvalidStringEscapeSequence = true
reportUnknownParameterType = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownVariableType = true
reportUnknownMemberType = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportCallInDefaultInitializer = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportAssertAlwaysTrue = true
reportSelfClsParameterName = true
reportImplicitStringConcatenation = false
reportUndefinedVariable = true
reportUnboundVariable = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUnsupportedDunderAll = true
reportUnusedCallResult = false
reportUnusedCoroutine = true
reportUnusedExpression = true
reportUnnecessaryTypeIgnoreComment = true
reportMatchNotExhaustive = true
reportImplicitOverride = false
